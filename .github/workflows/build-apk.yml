
name: Build Net-Lag Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK with Buildozer
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      BUILDOZER_WARN_ON_ROOT: "0"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install System Dependencies and Java 17
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            build-essential \
            ccache \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev

          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))" >> $GITHUB_ENV

      - name: Verify Java and Python
        run: |
          java -version
          javac -version
          python --version
          python -m pip --version

      - name: Verify Source Safety
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("main.py").read_text(
              encoding="utf-8"
          )

          blocked = [
              "sendto(",
              "def _flood",
              "STARTING ATTACK",
          ]

          found = [
              item for item in blocked
              if item in source
          ]

          if found:
              raise SystemExit(
                  "Unsafe flood functionality detected: "
                  + ", ".join(found)
                  + ". Convert main.py to a safe "
                    "network diagnostic app before building."
              )

          print("Source safety check passed.")
          PY

      - name: Check Python Syntax
        run: |
          python -m py_compile main.py

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Cache Buildozer Project Directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-project-${{ runner.os }}-

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython==0.29.36" \
            "buildozer==1.5.0"

      - name: Verify Build Tools
        run: |
          cython --version
          buildozer --version

      - name: Build Android Debug APK
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Net-Lag-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
